{% extends "base.html" %}
{% block content %}
<form class="card" method="post" action="/survey/{{ phase }}">
  <h1>{{ t('survey_pre_title' if phase == 'pre' else 'survey_post_title') }}</h1>
  <p class="muted">{{ t('survey_optional') }}</p>
  {% for key, text, options in questions %}
  <fieldset class="question" style="border:0;padding:0">
    <legend><strong>{{ text }}</strong></legend>
    <div class="opts">
      {% for value, label in options %}
      <label><input type="radio" name="{{ key }}" value="{{ value }}"> {{ label }}</label>
      {% endfor %}
      <label><input type="radio" name="{{ key }}" value="no_answer"> {{ t('prefer_not') }}</label>
    </div>
  </fieldset>
  {% endfor %}
  <p><button data-study="survey-next">{{ t('next') }}</button></p>
</form>
{% endblock %}
