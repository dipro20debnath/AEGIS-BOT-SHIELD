{% extends "base.html" %}
{% block content %}
<form class="consent-form" method="post" action="/survey/{{ phase }}">
  <h1 class="rise">{{ t('survey_pre_title' if phase == 'pre' else 'survey_post_title') }}</h1>
  <p class="lead rise" style="--d:1">{{ t('survey_optional') }}</p>
  {% for key, text, options in questions %}
  <fieldset class="question">
    <legend>{{ text }}</legend>
    <div class="chips">
      {% for value, label in options %}
      <label class="chip"><input type="radio" name="{{ key }}" value="{{ value }}"><span>{{ label }}</span></label>
      {% endfor %}
      <label class="chip quiet"><input type="radio" name="{{ key }}" value="no_answer"><span>{{ t('prefer_not') }}</span></label>
    </div>
  </fieldset>
  {% endfor %}
  <div class="actions"><button class="primary" data-study="survey-next">{{ t('next') }}{{ icon.arrow() }}</button></div>
</form>
{% endblock %}
