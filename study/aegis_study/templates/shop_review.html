{% extends "shop_base.html" %}
{% block content %}
<form class="narrow" method="post" action="/shop/review/{{ product.id }}">
  <h1>{{ t('review_title') }} <span class="light">{{ product.name }}</span></h1>
  {% if error %}<p class="error" role="alert">{{ icon.alert() }}{{ error }}</p>{% endif %}
  <label for="text">{{ t('your_review') }}</label>
  <textarea id="text" name="text" autocomplete="off"></textarea>
  <label>{{ t('stars') }}</label>
  <div class="starpick">
    {% for n in range(1, 6) %}<label><input type="radio" name="rating" value="{{ n }}"><span class="num">{{ n }} ★</span></label>{% endfor %}
  </div>
  <div class="actions"><button class="primary" data-study="submit-review">{{ t('submit') }}</button></div>
</form>
{% endblock %}
