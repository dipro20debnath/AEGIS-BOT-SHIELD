{% extends "base.html" %}
{% block content %}
<div class="measure">
  <svg class="done-mark" viewBox="0 0 96 96" aria-hidden="true">
    <path class="outline" d="M48 6 14 18v24c0 21 14.4 36.4 34 42 19.6-5.6 34-21 34-42V18z"/>
    <path class="ok" d="m32 48 11 11 22-23"/>
  </svg>
  <h1 class="rise" style="--d:2">{{ t('done_title') }}</h1>
  <p class="muted rise" style="--d:3">{{ t('done_code_label') }}</p>
  <p class="code-hero rise" style="--d:3">{{ code }}</p>
  <p class="rise" style="--d:4">{{ t('done_body', code=code) }}</p>
</div>
{% endblock %}
