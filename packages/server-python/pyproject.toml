[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-server-python"
version = "1.0.0"
description = "Bot-detection middleware for FastAPI, Flask and Django (AEGIS BOT SHIELD)"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dipro Debnath"}]
keywords = ["bot-detection", "security", "fastapi", "flask", "django", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/dipro20debnath/AEGIS-BOT-SHIELD"
Documentation = "https://github.com/dipro20debnath/AEGIS-BOT-SHIELD/tree/main/docs"
Issues = "https://github.com/dipro20debnath/AEGIS-BOT-SHIELD/issues"

[project.optional-dependencies]
django = ["django>=3.2"]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.95.0", "starlette>=0.26.1"]
# Shared state for several processes (AEGIS_REDIS_URL)
redis = ["redis[hiredis]>=4.2"]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.95.0",
    "flask>=2.0",
    "django>=3.2",
    "redis>=4.2",
    "jsonschema>=4.18",
    "openapi-spec-validator>=0.7",
]
dev = [
    "aegis-server-python[test]",
]

[tool.setuptools.package-data]
aegis_shield = ["openapi.json"]
