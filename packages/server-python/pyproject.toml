[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-server-python"
version = "1.0.0"
description = "Server-side Python SDK for Aegis Bot Shield"
authors = [{name = "Aegis Team", email = "team@aegisbotshield.com"}]
requires-python = ">=3.8"
dependencies = [
    "pyjwt>=2.8.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
django = ["django>=3.2"]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.95.0", "starlette>=0.26.1"]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]
