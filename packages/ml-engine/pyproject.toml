[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ml-engine"
version = "1.0.0"
description = "Machine Learning Engine for Aegis Bot Shield"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "lightgbm>=3.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "onnxruntime>=1.15.0",
    "torch>=2.0.0",
    "Flask>=2.3.0"
]
