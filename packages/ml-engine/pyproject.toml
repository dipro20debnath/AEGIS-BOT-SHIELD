[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ml-engine"
version = "1.0.0"
description = "Machine-learning engine of AEGIS BOT SHIELD: features, ensemble model, training, inference service"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dipro Debnath"}]
keywords = ["bot-detection", "machine-learning", "xgboost", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[project.urls]
Homepage = "https://github.com/dipro20debnath/AEGIS-BOT-SHIELD"
Documentation = "https://github.com/dipro20debnath/AEGIS-BOT-SHIELD/tree/main/docs"
Issues = "https://github.com/dipro20debnath/AEGIS-BOT-SHIELD/issues"

[project.optional-dependencies]
# HTTP inference service (aegis_ml/server.py)
server = ["fastapi>=0.95.0", "uvicorn>=0.22.0", "pydantic>=2.0.0"]
# Sequence models (Phase C)
deep = ["torch>=2.0.0"]
# Optional cross-check of the built-in XGBoost TreeSHAP against the shap package
explain = ["shap>=0.41.0"]
test = ["pytest>=7.0.0"]
dev = ["aegis-ml-engine[server,test]"]
