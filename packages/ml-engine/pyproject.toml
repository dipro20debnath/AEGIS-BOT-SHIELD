[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ml-engine"
version = "1.0.0"
description = "Machine Learning Engine for Aegis Bot Shield"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[project.optional-dependencies]
# HTTP inference service (aegis_ml/server.py)
server = ["fastapi>=0.95.0", "uvicorn>=0.22.0", "pydantic>=2.0.0"]
# Sequence models (Phase C)
deep = ["torch>=2.0.0"]
# SHAP explanations (Phase C)
explain = ["shap>=0.41.0"]
test = ["pytest>=7.0.0"]
dev = ["aegis-ml-engine[server,test]"]
