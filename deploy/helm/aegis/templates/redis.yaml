{{- if .Values.redis.enabled }}
{{- $name := include "aegis.name" (dict "root" . "component" "redis") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      {{- include "aegis.podSpecCommon" . | nindent 6 }}
      {{- include "aegis.podSecurity" (dict "root" . "uid" 999) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", {{ .Values.redis.maxMemory | quote }}, "--maxmemory-policy", "volatile-ttl"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "aegis.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
