{{- if .Values.dashboard.enabled }}
{{- $name := include "aegis.name" (dict "root" . "component" "dashboard") }}
{{- $nodeApi := printf "http://%s:3000" (include "aegis.name" (dict "root" . "component" "api-node")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
data:
  # Same as docker/dashboard.nginx.conf, with the in-cluster Node service
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /aegis/live {
            proxy_pass {{ $nodeApi }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        location /aegis/ {
            proxy_pass {{ $nodeApi }};
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" (dict "root" . "component" "dashboard") | nindent 8 }}
      annotations:
        checksum/config: {{ $nodeApi | sha256sum | trunc 16 }}
    spec:
      {{- include "aegis.podSpecCommon" . | nindent 6 }}
      {{- include "aegis.podSecurity" (dict "root" . "uid" 101) | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "aegis.image" (dict "root" . "component" "dashboard") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aegis.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
