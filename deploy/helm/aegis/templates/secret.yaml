{{- if not .Values.secret.existingSecret }}
{{- $key := required "Set secret.secretKey (at least 16 random characters, e.g. openssl rand -hex 32) or secret.existingSecret" .Values.secret.secretKey }}
{{- if lt (len $key) 16 }}
{{- fail "secret.secretKey must be at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.secretName" . }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "secret") | nindent 4 }}
type: Opaque
data:
  AEGIS_SECRET_KEY: {{ $key | b64enc | quote }}
{{- end }}
