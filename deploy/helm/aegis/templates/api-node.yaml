{{- if .Values.apiNode.enabled }}
{{- $name := include "aegis.name" (dict "root" . "component" "api-node") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "api-node") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.apiNode.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" (dict "root" . "component" "api-node") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" (dict "root" . "component" "api-node") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- include "aegis.prometheusAnnotations" (dict "root" . "port" 3000) | nindent 8 }}
    spec:
      {{- include "aegis.podSpecCommon" . | nindent 6 }}
      {{- include "aegis.podSecurity" (dict "root" . "uid" 1000) | nindent 6 }}
      containers:
        - name: api-node
          image: {{ include "aegis.image" (dict "root" . "component" "api-node") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "aegis.commonEnv" . | nindent 12 }}
            {{- with include "aegis.redisUrl" (dict "root" . "db" .Values.apiNode.redisDb) }}
            - name: AEGIS_REDIS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ml.enabled }}
            - name: AEGIS_ML_URL
              value: {{ printf "http://%s:8001" (include "aegis.name" (dict "root" . "component" "ml")) | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            httpGet: { path: /aegis/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /aegis/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /aegis/health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.apiNode.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "aegis.labels" (dict "root" . "component" "api-node") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aegis.selectorLabels" (dict "root" . "component" "api-node") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http }
{{- end }}
