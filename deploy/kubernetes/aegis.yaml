apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-dashboard
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/instance: aegis
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: aegis-bot-shield
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: aegis-1.0.0
data:
  # Same as docker/dashboard.nginx.conf, with the in-cluster Node service
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /aegis/live {
            proxy_pass http://aegis-api-node:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        location /aegis/ {
            proxy_pass http://aegis-api-node:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri /index.html;
        }
    }
