name: AEGIS BOT SHIELD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Node ${{ matrix.node-version }} - build, test, lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 5 / jsdom 30 need Node >= 22.12 (Node 20 reached end of life in April 2026)
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - run: npm test
      - run: npm run lint

  python:
    name: Python ${{ matrix.python-version }} - tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "packages/ml-engine[test]" -e "packages/server-python[test]"
      - run: pytest packages/ml-engine/tests packages/server-python/tests -v

  e2e:
    name: End-to-end (Chromium -> SDK -> Python server -> ML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: npm run build
      # non-editable on purpose: catches packaging mistakes (missing subpackages) that -e hides
      - run: pip install ./packages/ml-engine ./packages/server-python fastapi uvicorn
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm audit --audit-level=high
      - run: pip install pip-audit -e packages/ml-engine -e "packages/server-python[test]"
      - run: pip-audit --skip-editable
